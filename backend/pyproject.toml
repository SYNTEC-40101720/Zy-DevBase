[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devbase"
version = "0.3.1"
description = "devbase — Python-first desktop tool base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
desktop = [
    "pywebview>=5.3,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["devbase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"